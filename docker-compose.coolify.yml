version: "3.9"

# ── Coolify Deployment — fully self-contained (app + PostgreSQL) ──────────────
#
# Required env vars → set in Coolify Environment Variables tab:
#
#   DB_PASSWORD        strong password for PostgreSQL        (REQUIRED)
#   AGENT_EMAIL        inbox that receives quote alerts      (REQUIRED)
#   SMTP_HOST          e.g. smtp.gmail.com                   (optional)
#   SMTP_SENDER_EMAIL  e.g. noreply@yourdomain.com           (optional)
#   SMTP_PASSWORD      SMTP / app password                   (optional)
#
# On FIRST deploy, run on the server:
#   docker volume create insurancehub_pgdata
# ─────────────────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       InsuranceHub
      POSTGRES_USER:     insurancehub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurancehub -d InsuranceHub"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT:              Production
      DOTNET_RUNNING_IN_CONTAINER:         "true"
      ASPNETCORE_URLS:                     "http://+:8080"
      HTTP_PORTS:                          ""
      # Tell ASP.NET to trust X-Forwarded-* headers from Traefik/Coolify
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      DatabaseProvider:              PostgreSQL
      ConnectionStrings__PostgreSQL: "Host=db;Port=5432;Database=InsuranceHub;Username=insurancehub;Password=${DB_PASSWORD}"

      EmailSettings__SmtpHost:       ${SMTP_HOST:-}
      EmailSettings__SmtpPort:       ${SMTP_PORT:-587}
      EmailSettings__UseSsl:         ${SMTP_USE_SSL:-true}
      EmailSettings__SenderEmail:    ${SMTP_SENDER_EMAIL:-noreply@insurancehub.com}
      EmailSettings__SenderName:     InsuranceHub
      EmailSettings__SenderPassword: ${SMTP_PASSWORD:-}
      EmailSettings__AgentEmail:     ${AGENT_EMAIL:-}

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Nightly database backup: a compressed pg_dump every 24 hours into the
  # backups volume, keeping 14 days. An empty or failed dump is discarded and
  # the previous good backup is kept.
  # Restore:  gunzip -c insurancehub-YYYY-MM-DD.sql.gz | psql -h db -U insurancehub InsuranceHub
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/insurancehub-$$(date +%F).sql.gz
          if pg_dump -h db -U insurancehub InsuranceHub | gzip > "$$f.tmp" && [ "$$(gzip -dc "$$f.tmp" | wc -c)" -gt 1000 ]; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'insurancehub-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

# ── Volume — created manually once on the server before first deploy ──────────
# docker volume create insurancehub_pgdata
# This prevents Coolify from renaming it on each redeployment.
volumes:
  backups:
  pgdata:
    external: true
    name: insurancehub_pgdata
